<div class="modal-overlay modal-overlay--hidden" id="TASK_MODAL">
  <div class="modal" role="dialog" aria-modal="true">
    <h2 class="modal__title" id="MODAL_TITLE">New Task</h2>

    <div class="modal__field">
      <label class="modal__label" for="MODAL_TITLE_INPUT">Title</label>
      <input class="modal__input" id="MODAL_TITLE_INPUT" type="text" placeholder="Task title" />
    </div>

    <div class="modal__field">
      <label class="modal__label" for="MODAL_DESC_INPUT">Description</label>
      <textarea class="modal__input modal__textarea" id="MODAL_DESC_INPUT" placeholder="Optional description"></textarea>
    </div>

    <div class="modal__field">
      <label class="modal__label" for="MODAL_STATUS_SELECT">Status</label>
      <select class="modal__input" id="MODAL_STATUS_SELECT">
        <option value="todo">To Do</option>
        <option value="doing">Doing</option>
        <option value="done">Done</option>
      </select>
    </div>

    <div class="modal__field">
      <label class="modal__label" for="MODAL_DUE_DATE">Due date</label>
      <input class="modal__input" id="MODAL_DUE_DATE" type="date" />
    </div>

    <div class="modal__field">
      <label class="modal__label">Tags</label>
      <div class="tag-picker">
        <div class="tag-picker__row">
          <div class="tag-picker__selected" id="MODAL_TAGS_SELECTED"></div>
          <button type="button" class="tag-picker__add-btn" id="MODAL_TAGS_ADD">+</button>
        </div>
        <div class="tag-picker__input-wrap tag-picker__input-wrap--hidden" id="MODAL_TAGS_WRAP">
          <input class="modal__input tag-picker__input" id="MODAL_TAGS" type="text" placeholder="Search or create tag" autocomplete="off" />
          <div class="tag-picker__dropdown tag-picker__dropdown--hidden" id="MODAL_TAGS_DROPDOWN"></div>
        </div>
      </div>
    </div>

    <div class="modal__actions">
      <button class="modal__btn modal__btn--cancel" id="MODAL_CANCEL">Cancel</button>
      <button class="modal__btn modal__btn--confirm" id="MODAL_CONFIRM">Save</button>
    </div>
  </div>
</div>
